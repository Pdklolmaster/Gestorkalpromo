name: kaloferta_gestor
description: Gestor-kal - Inteligência Orçamentária 50/30/20
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1
  intl: ^0.19.0
  image_picker: ^1.0.7
  file_picker: ^8.0.0
  local_auth: ^2.1.6
  share_plus: ^7.2.1
  fl_chart: ^0.65.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.6
  # Adicionado para gerar os ícones do sistema
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.7

# Configuração do Ícone do Aplicativo (Launcher Icon)
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/iconapk.jpeg"
  # Cor de fundo para ícones adaptativos do Android (combinando com o teu tema dark)
  adaptive_icon_background: "#121212"
  adaptive_icon_foreground: "assets/images/iconapk.jpeg"

flutter:
  uses-material-design: true  
  assets:
    - assets/images/